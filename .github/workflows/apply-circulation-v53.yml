name: Verify and apply circulation V53
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-circulation-v53.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: circulation-v53-migration
  cancel-in-progress: false
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate vector surfaces and validate unchanged source coordinates
        run: |
          python -m pip install shapely==2.1.2
          python scripts/apply-circulation-v53.py
          python scripts/clip-legacy-parks-v53.py
          node --check tests/site-syntax-check.mjs
          node --check assets/circulation-v53.js
      - name: Install browser testing tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/daloc-http.log 2>&1 &
          node tests/smoke-circulation-v53.cjs
      - name: Preserve visual and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circulation-v53-validation
          path: |
            tests/artifacts/*.png
            docs/v53-*.json
            index.html
            assets/circulation-v53.json
            assets/circulation-v53.js
          retention-days: 3
      - name: Commit only the validated runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/circulation-v53.json assets/circulation-v53.js docs/v53-validation.json docs/v53-browser-check.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate narrow roads, planting bands and clear park overhangs [skip netlify]'
          git push origin HEAD:main
